<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .grid-line { stroke: #334155; stroke-width: 0.5; opacity: 0.4; }
    .pulse-circle { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-card { animation: float-slow 5s ease-in-out infinite; transform-origin: center; }
    .flowing-path { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16" />

  <!-- Background Grid -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="120" fill="#0284c7" opacity="0.25" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1050" cy="220" r="140" fill="#9333ea" opacity="0.2" filter="url(#glow)" class="pulse-circle" style="animation-delay: -3s;" />

  <!-- Dynamic Animated Terminal Lines / Flows (Background Layer) -->
  <path d="M 50 250 Q 300 290 600 250 T 1150 270" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-path" opacity="0.5" />
  <path d="M 100 270 Q 450 220 800 280 T 1100 230" fill="none" stroke="#818cf8" stroke-width="1.5" class="flowing-path" style="animation-direction: reverse; animation-duration: 3s;" opacity="0.4" />

  <!-- Dynamic Decorative Floating Cloud & Code Icons (Subtle background elements) -->
  <g class="floating-card" opacity="0.35">
    <path d="M 980 70 A 25 25 0 0 1 1025 80 A 20 20 0 0 1 1050 105 A 25 25 0 0 1 1025 130 L 970 130 A 20 20 0 0 1 970 90 A 25 25 0 0 1 980 70 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="985" y="110" font-family="monospace" font-size="14" fill="#38bdf8">$ aws</text>
  </g>
  
  <g class="floating-card" style="animation-delay: -2.5s;" opacity="0.35">
    <path d="M 120 180 A 20 20 0 0 1 155 190 A 15 15 0 0 1 170 210 L 115 210 A 15 15 0 0 1 115 180 Z" fill="none" stroke="#c084fc" stroke-width="2" />
    <text x="122" y="202" font-family="monospace" font-size="12" fill="#c084fc">$ az</text>
  </g>

  <!-- Main Content Box (Ensures text stays in crisp foreground) -->
  <rect x="180" y="55" width="840" height="210" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Cloud Icon -->
    <path d="M 570 85 A 18 18 0 0 1 602 92 A 15 15 0 0 1 620 112 L 560 112 A 15 15 0 0 1 560 92 A 18 18 0 0 1 570 85 Z" fill="url(#text-grad)" />
    
    <!-- Main Title -->
    <text x="600" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="40" fill="url(#text-grad)" letter-spacing="0.5">
      Awesome Cloud Command Line Interface
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="0.2">
      ⚡ Curated SaaS Platforms, Multi-Cloud Tools &amp; Open-Source CLIs ⚡
    </text>
    
    <!-- Badges/Pills Row in Foreground -->
    <g transform="translate(370, 218)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="65" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">☁️ Multi-Cloud</text>
      
      <!-- Pill 2 -->
      <rect x="150" y="0" width="140" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="220" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">🛠️ DevOps &amp; IaC</text>
      
      <!-- Pill 3 -->
      <rect x="305" y="0" width="150" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="380" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">🔓 Open-Source</text>
    </g>
  </g>
</svg>
